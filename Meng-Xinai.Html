<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#02040e">
<title>宇末新X </title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:#02040e;color:#fff;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  /* ============ 场景层 ============ */
  .scene{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}

  .sky{
    position:absolute;left:0;top:0;width:100%;height:82%;
    background:linear-gradient(180deg,
      #01030b 0%,
      #050b21 14%,
      #0a1836 28%,
      #102b4e 42%,
      #1a4568 55%,
      #2c6b85 66%,
      #63a3a6 74%,
      #b8bda3 79%,
      #ffd6a0 82%);
  }

  /* 星星 */
  .stars{position:absolute;inset:0 0 40% 0}
  .star{
    position:absolute;background:#fff;border-radius:50%;
    box-shadow:0 0 6px rgba(190,225,255,.9);
    animation:twinkle var(--d) ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:.15;transform:scale(.8)}to{opacity:1;transform:scale(1)}}

  /* 地平线光晕 */
  .horizon-glow{
    position:absolute;left:0;bottom:18%;width:100%;height:26vh;
    background:radial-gradient(ellipse at 50% 100%,
      rgba(255,203,140,.55) 0%,
      rgba(255,160,110,.22) 32%,
      rgba(120,190,220,.10) 60%,
      transparent 78%);
    filter:blur(6px);
    animation:breath 7s ease-in-out infinite;
  }
  @keyframes breath{0%,100%{opacity:.85}50%{opacity:1}}

  /* 云海 */
  .cloudband{position:absolute;inset:0;overflow:hidden}
  .cloud{
    position:absolute;left:0;
    width:var(--w);
    height:calc(var(--w) * .3);
    border-radius:50%;
    background:radial-gradient(ellipse at 50% 55%,
      rgba(255,255,255,.95) 0%,
      rgba(255,255,255,.42) 42%,
      rgba(255,255,255,0) 74%);
    filter:blur(var(--blur));
    opacity:var(--op);
    animation:drift var(--dur) linear infinite;
    animation-delay:var(--delay);
    will-change:transform;
  }
  @keyframes drift{
    from{transform:translateX(-45vw) translateZ(0)}
    to{transform:translateX(145vw) translateZ(0)}
  }

  /* 山 */
  .mountain{position:absolute;left:-2%;width:104%;bottom:11vh;height:58vh}
  .mountain svg{width:100%;height:100%;display:block}
  .m-far{z-index:3;filter:blur(.6px);opacity:.92}
  .m-near{z-index:4}

  /* 海 */
  .sea{
    position:absolute;left:0;right:0;bottom:0;height:22vh;z-index:5;overflow:hidden;
    background:linear-gradient(180deg,#0d2a41 0%,#071728 38%,#02060e 100%);
    box-shadow:0 -1px 0 rgba(255,214,160,.55), 0 -8px 40px rgba(255,190,130,.22);
  }
  .sea::before{
    content:"";position:absolute;left:50%;top:-14%;width:30vw;height:140%;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 0%,
      rgba(255,216,164,.60) 0%,
      rgba(255,196,140,.18) 38%,
      transparent 72%);
    filter:blur(16px);
    animation:breath 5s ease-in-out infinite;
  }
  .sea::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,
      rgba(255,255,255,0) 0px,
      rgba(255,255,255,.09) 1px,
      rgba(255,255,255,0) 3px,
      rgba(255,255,255,0) 8px);
    animation:waveShift 8s linear infinite;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);
  }
  @keyframes waveShift{from{background-position:0 0}to{background-position:0 32px}}

  /* ============ 内容层 ============ */
  .content{
    position:relative;z-index:20;
    min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:clamp(26px,6.5vh,66px) clamp(16px,5vw,40px)
            calc(clamp(26px,6.5vh,66px) + env(safe-area-inset-bottom));
    gap:clamp(16px,3.5vh,36px);
    text-align:center;
  }

  /* ---- Logo ---- */
  .brand{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}

  .logo-wrap{position:relative;display:inline-block}
  .halo{
    position:absolute;left:50%;top:50%;
    width:150%;height:420%;
    transform:translate(-50%,-50%);
    background:conic-gradient(from 0deg,
      transparent 0%,
      rgba(111,227,255,.40) 12%,
      transparent 28%,
      rgba(255,210,138,.35) 48%,
      transparent 62%,
      rgba(167,139,250,.42) 82%,
      transparent 100%);
    filter:blur(38px);
    border-radius:50%;
    animation:spin 14s linear infinite;
    opacity:.85;
    pointer-events:none;
  }
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

  .logo{
    position:relative;
    display:flex;align-items:baseline;justify-content:center;
    font-size:clamp(2.3rem,11.5vw,5.6rem);
    font-weight:900;
    line-height:1.06;
    letter-spacing:.05em;
    user-select:none;
  }
  .logo span{
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 22px rgba(120,215,255,.45));
  }
  .logo .cn{
    background-image:linear-gradient(100deg,#ffffff 0%,#a9e6ff 22%,#ffffff 46%,#ffe1b0 72%,#ffffff 100%);
    background-size:260% 100%;
    animation:shine 5s linear infinite;
  }
  .logo .x{
    margin-left:.04em;
    background-image:linear-gradient(135deg,#6fe3ff 0%,#a78bfa 45%,#ffd28a 100%);
    background-size:220% 220%;
    animation:xPulse 3.2s ease-in-out infinite;
  }
  @keyframes shine{from{background-position:0% 50%}to{background-position:260% 50%}}
  @keyframes xPulse{
    0%,100%{background-position:0% 50%;transform:translateY(0) scale(1)}
    50%{background-position:100% 50%;transform:translateY(-3px) scale(1.06)}
  }

  .tagline{
    font-size:clamp(.72rem,3.1vw,.95rem);
    letter-spacing:.38em;
    text-indent:.38em;
    color:rgba(214,236,255,.72);
    font-weight:300;
    text-shadow:0 0 18px rgba(120,200,255,.35);
  }
  .divider{
    width:clamp(80px,30vw,190px);height:1px;
    background:linear-gradient(90deg,transparent,rgba(150,220,255,.75),transparent);
    margin-top:2px;
  }

  /* ---- 网络时间 ---- */
  .clock-card{
    display:inline-flex;flex-direction:column;align-items:center;gap:6px;
    padding:clamp(14px,3.4vw,22px) clamp(22px,7vw,44px);
    border-radius:22px;
    background:rgba(8,20,38,.42);
    border:1px solid rgba(140,205,255,.20);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 40px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.09);
  }
  .clock-time{
    font-size:clamp(1.7rem,8.5vw,3rem);
    font-weight:800;
    letter-spacing:.06em;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#ffffff,#9fdcff 70%,#6fb6e6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 16px rgba(120,210,255,.45));
  }
  .clock-date{
    font-size:clamp(.72rem,3.2vw,.9rem);
    color:rgba(214,236,255,.78);
    letter-spacing:.12em;
  }
  .clock-label{
    display:flex;align-items:center;gap:7px;
    font-size:clamp(.58rem,2.6vw,.7rem);
    letter-spacing:.24em;
    color:rgba(150,200,235,.6);
    margin-top:2px;
  }
  .dot{
    width:6px;height:6px;border-radius:50%;
    background:#54ffa8;
    box-shadow:0 0 10px #54ffa8;
    animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}

  /* ---- 链接按钮 ---- */
  .links{
    display:flex;flex-wrap:wrap;justify-content:center;
    gap:clamp(10px,2.8vw,18px);
    width:100%;max-width:760px;
  }
  .link{
    position:relative;
    flex:1 1 190px;
    max-width:250px;
    display:flex;align-items:center;gap:12px;
    padding:clamp(12px,3.2vw,16px) clamp(14px,3.6vw,20px);
    border-radius:18px;
    text-decoration:none;color:#fff;
    background:rgba(10,24,44,.50);
    border:1px solid rgba(150,210,255,.20);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 28px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.08);
    overflow:hidden;
    transition:transform .28s cubic-bezier(.2,.8,.3,1),
               box-shadow .28s, border-color .28s, background .28s;
  }
  .link::after{
    content:"";position:absolute;top:0;left:-120%;
    width:60%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);
    transform:skewX(-22deg);
    transition:left .7s ease;
  }
  .link:hover::after,.link:active::after{left:160%}
  .link:hover,.link:active{
    transform:translateY(-4px);
    background:rgba(16,36,64,.68);
    border-color:var(--c2);
    box-shadow:0 14px 40px rgba(0,0,0,.5), 0 0 26px -4px var(--c2);
  }
  .ico{
    flex:0 0 auto;
    width:clamp(34px,9.5vw,40px);height:clamp(34px,9.5vw,40px);
    display:grid;place-items:center;
    border-radius:12px;
    background:var(--grad);
    box-shadow:0 4px 16px -3px var(--c2);
  }
  .ico svg{width:58%;height:58%;color:#fff}
  .meta{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;min-width:0}
  .meta strong{font-size:clamp(.9rem,3.9vw,1.02rem);letter-spacing:.05em;font-weight:800}
  .meta em{
    font-style:normal;
    font-size:clamp(.6rem,2.7vw,.72rem);
    color:rgba(190,220,245,.62);
    letter-spacing:.1em;
    white-space:nowrap;
  }

  .qq{--c2:#12b7f5;--grad:linear-gradient(135deg,#35c8ff,#0a84d6)}
  .dy{--c2:#ff2c55;--grad:linear-gradient(135deg,#25f4ee,#ff2c55)}
  .wb{--c2:#ff8200;--grad:linear-gradient(135deg,#ffb64d,#e6162d)}

  /* ---- 页脚 ---- */
  .footer{
    font-size:clamp(.55rem,2.4vw,.66rem);
    letter-spacing:.28em;
    color:rgba(150,190,220,.42);
    text-indent:.28em;
  }

  /* ============ 响应式 ============ */
  @media (max-width:600px){
    .content{justify-content:center;gap:clamp(22px,5vh,40px)}
    .link{flex:1 1 100%;max-width:340px}
    .cloud{--w:calc(var(--w) * .8)}
    .sea{height:20vh}
    .mountain{bottom:9vh;height:52vh}
  }
  @media (min-width:1100px){
    .content{max-width:1100px;margin:0 auto}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition:none !important}
  }
</style>
</head>
<body>

<!-- ========== 背景场景：山动云海 ========== -->
<div class="scene" aria-hidden="true">
  <div class="sky"></div>
  <div class="stars" id="stars"></div>
  <div class="horizon-glow"></div>
  <div class="cloudband" id="cloudband"></div>

  <!-- 远山 -->
  <div class="mountain m-far">
    <svg viewBox="0 0 1440 400" preserveAspectRatio="none">
      <defs>
        <linearGradient id="gFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#2a5b82"/>
          <stop offset="55%" stop-color="#123css"/>
          <stop offset="100%" stop-color="#0a1c30"/>
        </linearGradient>
      </defs>
      <path fill="#1b3f60" opacity=".85" d="
        M0,400 L0,270
        C70,215 130,190 200,215
        C270,240 320,140 400,140
        C470,140 500,205 570,215
        C640,225 690,120 770,120
        C850,120 880,205 950,220
        C1020,235 1070,145 1150,150
        C1230,155 1270,215 1330,230
        C1380,242 1410,220 1440,230
        L1440,400 Z"/>
    </svg>
  </div>

  <!-- 近山 -->
  <div class="mountain m-near">
    <svg viewBox="0 0 1440 400" preserveAspectRatio="none">
      <path fill="#0a1a2c" opacity=".97" d="
        M0,400 L0,320
        C80,280 140,250 220,285
        C300,320 340,200 430,195
        C520,190 550,290 640,300
        C730,310 780,180 880,175
        C980,170 1010,290 1100,300
        C1180,308 1230,230 1310,245
        C1370,256 1410,290 1440,300
        L1440,400 Z"/>
      <path fill="#040a14" opacity=".9" d="
        M0,400 L0,352
        C120,330 200,318 300,342
        C400,366 480,300 600,312
        C720,324 800,352 900,344
        C1010,335 1100,300 1220,322
        C1330,342 1400,356 1440,360
        L1440,400 Z"/>
    </svg>
  </div>

  <!-- 海 -->
  <div class="sea"></div>
</div>

<!-- ========== 内容 ========== -->
<main class="content">

  <!-- Logo -->
  <header class="brand">
    <div class="logo-wrap">
      <div class="halo"></div>
      <h1 class="logo">
        <span class="cn">宇末新</span><span class="x">X</span>
      </h1>
    </div>
    <div class="divider"></div>
    <p class="tagline"> 好爱您！真心好 </p>
  </header>

  <!-- 网络时间 -->
  <section class="clock-card" aria-label="网络时间">
    <div class="clock-time" id="clockTime">--:--:--</div>
    <div class="clock-date" id="clockDate">————</div>
    <div class="clock-label"><i class="dot"></i>时间 · 实时同步</div>
  </section>

  <!-- 链接 -->
  <nav class="links" aria-label="社交链接">
    <a class="link qq" href="https://qm.qq.com/q/aPUYQNFxLi" target="_blank" rel="noopener noreferrer">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2.2c-3.1 0-5.2 2.4-5.2 5.6 0 .5 0 1 .1 1.4-.9 1.1-1.9 2.7-1.9 4.3 0 .9.4 1.5 1 1.7.5.2 1-.1 1.4-.6.2.5.5 1 .9 1.4-.6.3-1 .7-1 1.2 0 .9 1.6 1.5 3.7 1.5s3.7-.6 3.7-1.5c0-.5-.4-.9-1-1.2.4-.4.7-.9.9-1.4.4.5.9.8 1.4.6.6-.2 1-.8 1-1.7 0-1.6-1-3.2-1.9-4.3.1-.4.1-.9.1-1.4 0-3.2-2.1-5.6-5.2-5.6z"/>
        </svg>
      </span>
      <span class="meta"><strong>QQ</strong><em>点击打开链接</em></span>
    </a>

    <a class="link dy" href="https://v.douyin.com/OeZSOlE5gDk/" target="_blank" rel="noopener noreferrer">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M16.6 2h-2.9v12.6a2.4 2.4 0 1 1-2-2.4V9.3a5.3 5.3 0 1 0 4.9 5.3V9.2a6.4 6.4 0 0 0 3.6 1.1V7.4a3.7 3.7 0 0 1-3.6-3.7V2z"/>
        </svg>
      </span>
      <span class="meta"><strong>抖音</strong><em>点击打开链接</em></span>
    </a>

    <a class="link wb" href="https://weibo.com/u/8000934642" target="_blank" rel="noopener noreferrer">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" aria-hidden="true">
          <ellipse cx="10" cy="14" rx="6.4" ry="5"/>
          <circle cx="10" cy="14" r="2.1" fill="currentColor" stroke="none"/>
          <path d="M17.2 4.6c2.4 0 4.3 2 4.3 4.3"/>
          <path d="M16.6 8.2c.9 0 1.6.7 1.6 1.6"/>
        </svg>
      </span>
      <span class="meta"><strong>微博</strong><em>点击打开链接</em></span>
    </a>
  </nav>

  <footer class="footer">宇末新X · 设计更新中</footer>
</main>

<script>
(function () {
  "use strict";

  /* ---------- 星星 ---------- */
  (function stars() {
    var box = document.getElementById("stars");
    if (!box) return;
    var n = window.innerWidth < 600 ? 60 : 130;
    var buf = "";
    for (var i = 0; i < n; i++) {
      var s = (Math.random() * 1.8 + 0.6).toFixed(2);
      buf += '<i class="star" style="' +
        'left:' + (Math.random() * 100).toFixed(2) + '%;' +
        'top:' + (Math.random() * 58).toFixed(2) + '%;' +
        'width:' + s + 'px;height:' + s + 'px;' +
        '--d:' + (Math.random() * 3 + 1.6).toFixed(2) + 's;' +
        'animation-delay:-' + (Math.random() * 4).toFixed(2) + 's;' +
        'opacity:' + (Math.random() * 0.6 + 0.3).toFixed(2) + '"></i>';
    }
    box.innerHTML = buf;
  })();

  /* ---------- 云海 ---------- */
  (function clouds() {
    var band = document.getElementById("cloudband");
    if (!band) return;
    var isMobile = window.innerWidth < 700;
    var n = isMobile ? 8 : 14;
    var buf = "";
    for (var i = 0; i < n; i++) {
      var w = (isMobile ? 130 : 170) + Math.random() * (isMobile ? 200 : 320);
      var top = 50 + Math.random() * 28;          // 50% ~ 78%
      var dur = 70 + Math.random() * 90;          // 70s ~ 160s
      var delay = -Math.random() * dur;
      var op = 0.16 + Math.random() * 0.34;
      var blur = 14 + Math.random() * 22;
      buf += '<span class="cloud" style="' +
        '--w:' + w.toFixed(0) + 'px;' +
        'top:' + top.toFixed(1) + '%;' +
        '--dur:' + dur.toFixed(1) + 's;' +
        '--delay:' + delay.toFixed(1) + 's;' +
        '--op:' + op.toFixed(2) + ';' +
        '--blur:' + blur.toFixed(0) + 'px"></span>';
    }
    band.innerHTML = buf;
  })();

  /* ---------- 网络时间（本地时钟实时刷新） ---------- */
  (function clock() {
    var tEl = document.getElementById("clockTime");
    var dEl = document.getElementById("clockDate");
    if (!tEl || !dEl) return;

    var WEEK = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
    function pad(v) { return v < 10 ? "0" + v : "" + v; }

    function tick() {
      var d = new Date();
      tEl.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
      dEl.textContent = d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日　" + WEEK[d.getDay()];
    }
    tick();
    setInterval(tick, 1000);
  })();

})();
</script>
</body>
</html>
